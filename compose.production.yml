name: uyjobs-production

services:
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    image: uyjobs-production-web
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      AUTH_SECRET: ${AUTH_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      APP_URL: ${APP_URL:-https://trabajogpt.eikoslabs.com}
      CRON_SECRET: ${CRON_SECRET:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_BUCKET: ${S3_BUCKET:-uyjobs-cvs}
      AI_BASE_URL: ${AI_BASE_URL:-https://opencode.ai/zen/go/v1}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-longcat-2.5-preview-free}
    networks:
      - glyphium-network
    ports:
      - "127.0.0.1:5182:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  landing:
    build:
      context: ./landing
      dockerfile: Dockerfile
    image: uyjobs-production-landing
    restart: unless-stopped
    networks:
      - glyphium-network
    ports:
      - "127.0.0.1:5183:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost/"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s

networks:
  glyphium-network:
    external: true
